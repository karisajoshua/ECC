name: Codex Integration

on:
  pull_request:
    branches: [main, feature/engineering-control-plane-foundation]

permissions:
  contents: read

concurrency:
  group: codex-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-integration:
    name: Codex skill and navigation checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Validate Codex skill surface
        run: node tests/ci/codex-skill-surface.test.js

      - name: Validate Codex navigation
        run: node tests/docs/codex-navigation-map.test.js
